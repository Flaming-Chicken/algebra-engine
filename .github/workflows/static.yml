# GitHub Actions: Compile and deploy the URAE WASM edge runtime to GitHub Pages and Cloudflare Workers
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Private Git Auth (Optional)
        env:
          SPODEIAN_GIT_TOKEN: ${{ secrets.SPODEIAN_CORE_TOKEN || secrets.PRIVATE_READ_ACCESS || secrets.GH_PAT }}
        run: |
          if [ -n "$SPODEIAN_GIT_TOKEN" ]; then
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
            git config --global url."https://x-access-token:${SPODEIAN_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Allocate 8GB Swap Space (Prevent OOM)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Determine wasm-bindgen Version from Cargo.lock
        id: wb
        run: echo "version=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version =' | head -n 1 | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli Binary
        id: cache-wb
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-${{ steps.wb.outputs.version }}

      - name: Install wasm-bindgen-cli (matched to Cargo.lock)
        if: steps.cache-wb.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked

      - name: Cache wasm-opt Binary (Binaryen)
        id: cache-wasm-opt
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-opt
          key: ${{ runner.os }}-wasm-opt-version_132

      - name: Install Binaryen wasm-opt (v132)
        if: steps.cache-wasm-opt.outputs.cache-hit != 'true'
        run: |
          BINARYEN_VERSION="version_132"
          mkdir -p ~/.cargo/bin
          wget -qO- "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xzf -
          mv "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" ~/.cargo/bin/wasm-opt
          chmod +x ~/.cargo/bin/wasm-opt
          rm -rf "binaryen-${BINARYEN_VERSION}"

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Web Application
        env:
          RUSTFLAGS: "-C target-feature=+simd128,+bulk-memory,+mutable-globals,+nontrapping-fptoint,+sign-ext -C link-arg=-zstack-size=2097152"
        run: |
          cargo build -p urae-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir crates/urae-wasm/public/pkg target/wasm32-unknown-unknown/release/urae_wasm.wasm
          for wasm_file in crates/urae-wasm/public/pkg/*.wasm; do
            if [ -f "$wasm_file" ]; then
              echo "Optimizing $wasm_file with wasm-opt"
              wasm-opt -Oz --enable-simd "$wasm_file" -o "$wasm_file" || true
            fi
          done
          rm -f crates/urae-wasm/public/_worker.js crates/urae-wasm/public/_routes.json

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Minify Production Assets (HTML, CSS, JS)
        run: |
          echo "=== Minifying Production Distribution Assets in crates/urae-wasm/public ==="
          if [ -d "crates/urae-wasm/public" ]; then
            for js_file in crates/urae-wasm/public/*.js crates/urae-wasm/public/pkg/*.js; do
              if [ -f "$js_file" ]; then
                echo "Minifying JS: $js_file"
                npx --yes esbuild "$js_file" --minify --allow-overwrite --outfile="$js_file" || true
              fi
            done
            for scss_file in crates/urae-wasm/public/*.scss; do
              if [ -f "$scss_file" ]; then
                css_file="${scss_file%.scss}.css"
                echo "Compiling SCSS: $scss_file -> $css_file"
                npx --yes sass "$scss_file" "$css_file" --no-source-map || true
              fi
            done
            for css_file in crates/urae-wasm/public/*.css; do
              if [ -f "$css_file" ]; then
                echo "Minifying CSS: $css_file"
                npx --yes esbuild "$css_file" --minify --allow-overwrite --outfile="$css_file" || true
              fi
            done
            if [ -f "crates/urae-wasm/public/index.html" ]; then
              echo "Minifying HTML: crates/urae-wasm/public/index.html"
              npx --yes html-minifier-terser --collapse-whitespace --remove-comments --remove-redundant-attributes --remove-script-type-attributes --remove-style-link-type-attributes --use-short-doctype --minify-css true --minify-js true -o crates/urae-wasm/public/index.html crates/urae-wasm/public/index.html || true
            fi
          fi

      - name: Setup Pages
        id: setup-pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload compiled assets artifact (Pages)
        if: steps.setup-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'crates/urae-wasm/public'

      - name: Upload compiled assets artifact (Fallback for Private Repo)
        if: steps.setup-pages.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: 'crates/urae-wasm/public'
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: steps.setup-pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy to Cloudflare Workers
        if: github.repository_owner == 'Spodeian' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
