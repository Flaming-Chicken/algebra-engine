# GitHub Actions: Compile and deploy the URAE WASM edge runtime to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_owner == 'Spodeian'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Allocate 8GB Swap Space (Prevent OOM)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@wasm-bindgen-cli

      - name: Cache wasm-opt Binary (Binaryen)
        id: cache-wasm-opt
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-opt
          key: ${{ runner.os }}-wasm-opt-version_132

      - name: Install Binaryen wasm-opt (v132)
        if: steps.cache-wasm-opt.outputs.cache-hit != 'true'
        run: |
          BINARYEN_VERSION="version_132"
          mkdir -p ~/.cargo/bin
          wget -qO- "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xzf -
          mv "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" ~/.cargo/bin/wasm-opt
          chmod +x ~/.cargo/bin/wasm-opt
          rm -rf "binaryen-${BINARYEN_VERSION}"

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Web Application
        env:
          RUSTFLAGS: "-C target-feature=+simd128,+bulk-memory,+mutable-globals,+nontrapping-fptoint,+sign-ext -C link-arg=-zstack-size=2097152"
        run: |
          cargo build -p urae-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir crates/urae-wasm/public/pkg target/wasm32-unknown-unknown/release/urae_wasm.wasm
          for wasm_file in crates/urae-wasm/public/pkg/*.wasm; do
            if [ -f "$wasm_file" ]; then
              echo "Optimizing $wasm_file with wasm-opt"
              wasm-opt -Oz --enable-simd "$wasm_file" -o "$wasm_file" || true
            fi
          done

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Minify Production Assets (HTML, CSS, JS)
        run: |
          echo "=== Minifying Production Distribution Assets in crates/urae-wasm/public ==="
          if [ -d "crates/urae-wasm/public" ]; then
            for js_file in crates/urae-wasm/public/*.js crates/urae-wasm/public/pkg/*.js; do
              if [ -f "$js_file" ]; then
                echo "Minifying JS: $js_file"
                npx --yes esbuild "$js_file" --minify --allow-overwrite --outfile="$js_file" || true
              fi
            done
            for scss_file in crates/urae-wasm/public/*.scss; do
              if [ -f "$scss_file" ]; then
                css_file="${scss_file%.scss}.css"
                echo "Compiling SCSS: $scss_file -> $css_file"
                npx --yes sass "$scss_file" "$css_file" --no-source-map || true
              fi
            done
            for css_file in crates/urae-wasm/public/*.css; do
              if [ -f "$css_file" ]; then
                echo "Minifying CSS: $css_file"
                npx --yes esbuild "$css_file" --minify --allow-overwrite --outfile="$css_file" || true
              fi
            done
            if [ -f "crates/urae-wasm/public/index.html" ]; then
              echo "Minifying HTML: crates/urae-wasm/public/index.html"
              npx --yes html-minifier-terser --collapse-whitespace --remove-comments --remove-redundant-attributes --remove-script-type-attributes --remove-style-link-type-attributes --use-short-doctype --minify-css true --minify-js true -o crates/urae-wasm/public/index.html crates/urae-wasm/public/index.html || true
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled assets artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'crates/urae-wasm/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
