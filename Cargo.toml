[workspace]
resolver = "3"
members = [
    "crates/auto-promoters",
    "crates/algebra-core",
    "crates/algebra-engine",
    "crates/algebra-advanced",
    "crates/urae",
    "crates/urae-notebook",
    "crates/urae-cli",
    "crates/urae-wasm",
    "crates/urae-lsp",
    "crates/urae-kernel",
    "crates/urae-py",
    "crates/urae-ffi",
    "tests",
]

[workspace.package]
version = "0.3.1"
authors = ["Liam <spodeian@proton.me>"]
edition = "2024"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/Spodeian/algebra-engine"
homepage = "https://github.com/Spodeian/algebra-engine"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
collapsible_if = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
needless_borrow = "allow"
nonminimal_bool = "allow"
get_first = "allow"
approx_constant = "allow"
match_like_matches_macro = "allow"

[workspace.dependencies]
# Internal workspace crates
auto-promoters = { path = "crates/auto-promoters" }
algebra-core = { path = "crates/algebra-core" }
algebra-engine = { path = "crates/algebra-engine" }
algebra-advanced = { path = "crates/algebra-advanced" }
urae = { path = "crates/urae" }
urae-notebook = { path = "crates/urae-notebook" }
urae-cli = { path = "crates/urae-cli" }
urae-lsp = { path = "crates/urae-lsp" }
urae-kernel = { path = "crates/urae-kernel" }
urae-py = { path = "crates/urae-py" }
urae-ffi = { path = "crates/urae-ffi" }

# GUI & Graphic dependencies
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_plot = "0.37"
winit = { version = "0.30", default-features = false }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
spodeian-tokens = { path = "../spodeian-core/crates/spodeian-tokens", version = "^1.0.0" }
spodeian-telemetry = { path = "../spodeian-core/crates/spodeian-telemetry", version = "^1.0.0" }
spodeian-export = { path = "../spodeian-core/crates/spodeian-export", version = "^1.0.0" }
spodeian-web-utils = { path = "../spodeian-core/crates/spodeian-web-utils", version = "^1.0.0" }
spodeian-ml-utils = { path = "../spodeian-core/crates/spodeian-ml-utils", version = "^0.1.0" }
spodeian-lake = { path = "../spodeian-core/crates/spodeian-lake", version = "^0.1.0" }


# Numerics & High-Precision CAS
bnum = "0.13"
num = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-bigint = "0.4"
dashu = "0.4"
egg = "0.9"

# Concurrency, collections & data structures
dashmap = "6.1"
rayon = "1.10"
parking_lot = "0.12"
smallvec = { version = "1.13", features = ["serde"] }
ahash = { version = "0.8", features = ["serde"] }
mimalloc = "0.1"

# Serialization & formatters
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bson = "2.13"
base64 = "0.22"
nom = "7.1"

# Logging & error handling
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking & HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# WASM & Web bindings
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Performance"] }
web-time = "1.1"

# Benchmarking
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

# Fast test execution: line-level debuginfo for quick linking, optimized dependencies for faster test runs
[profile.test]
debug = 1

[profile.test.package."*"]
opt-level = 2


