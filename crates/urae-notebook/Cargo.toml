[package]
name = "urae-notebook"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-platform egui reactive mathematics notebook application for URAE"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "urae-notebook"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
urae = { workspace = true, features = ["full", "cli"] }
egui.workspace = true
egui_plot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
getrandom.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys.workspace = true
web-time.workspace = true
bson.workspace = true
base64.workspace = true
miniz_oxide = "0.8"
js-sys = "0.3"
toml.workspace = true
spodeian-tokens = { workspace = true }
spodeian-telemetry = { workspace = true }
spodeian-export = { workspace = true }
spodeian-web-utils = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
mimalloc.workspace = true
spodeian-parallel.workspace = true
spodeian-telemetry.workspace = true
tracing-subscriber.workspace = true
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android-activity = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true }

[features]
default = ["accesskit", "wgpu"]
accesskit = ["eframe/accesskit"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]
persistence = ["eframe/persistence"]

