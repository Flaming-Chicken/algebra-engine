name = "algebra-engine"
main = "crates/urae-wasm/worker.js"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[alias]
env = "./crates/urae-wasm/env.js"

[assets]
directory = "crates/urae-wasm/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "urae.spodeian.trade"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
ENVIRONMENT = "production"
